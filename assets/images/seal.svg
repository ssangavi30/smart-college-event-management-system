<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <path id="textPathUpper" d="M 30,100 A 70,70 0 1,1 170,100" />
    <path id="textPathLower" d="M 170,100 A 70,70 0 1,1 30,100" />
  </defs>
  
  <!-- Outer Gold Rim -->
  <circle cx="100" cy="100" r="92" fill="#fffbf0" stroke="#d97706" stroke-width="4" stroke-dasharray="3 2"/>
  <circle cx="100" cy="100" r="84" fill="none" stroke="#b45309" stroke-width="1.5"/>
  <circle cx="100" cy="100" r="58" fill="none" stroke="#b45309" stroke-width="1.5"/>
  
  <!-- Curved Text -->
  <text font-family="'Poppins', sans-serif" font-size="11" font-weight="700" fill="#92400e" letter-spacing="2.2">
    <textPath href="#textPathUpper" startOffset="50%" text-anchor="middle">
      SMART COLLEGE OF TECHNOLOGY
    </textPath>
  </text>
  
  <text font-family="'Poppins', sans-serif" font-size="9" font-weight="600" fill="#92400e" letter-spacing="2">
    <textPath href="#textPathLower" startOffset="50%" text-anchor="middle">
      ★ EXCELLENCE &amp; LEADERSHIP ★
    </textPath>
  </text>

  <!-- Central Crest -->
  <g transform="translate(68, 68) scale(0.64)">
    <polygon points="50,15 90,85 10,85" fill="#fef3c7" stroke="#b45309" stroke-width="3"/>
    <!-- Torch / Flame -->
    <path d="M50,30 C45,45 55,50 48,65 C58,60 55,42 50,30 Z" fill="#dc2626"/>
    <path d="M50,38 C48,46 54,50 50,60 C55,55 53,44 50,38 Z" fill="#f59e0b"/>
    <rect x="46" y="65" width="8" height="15" fill="#b45309" rx="2"/>
    <polygon points="40,80 60,80 50,75" fill="#b45309"/>
  </g>
</svg>
