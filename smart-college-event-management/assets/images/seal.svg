<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <path id="textPathUpper" d="M 30,100 A 70,70 0 1,1 170,100" />
    <path id="textPathLower" d="M 170,100 A 70,70 0 1,1 30,100" />
    <linearGradient id="sealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b192c" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
  </defs>
  
  <!-- Outer Rim -->
  <circle cx="100" cy="100" r="92" fill="#f0fdfa" stroke="#0891b2" stroke-width="3.5" stroke-dasharray="3 2"/>
  <circle cx="100" cy="100" r="84" fill="none" stroke="#0b192c" stroke-width="1.5"/>
  <circle cx="100" cy="100" r="58" fill="none" stroke="#0284c7" stroke-width="1.5"/>
  
  <!-- Curved Text -->
  <text font-family="'Poppins', sans-serif" font-size="10.5" font-weight="700" fill="#0b192c" letter-spacing="2.2">
    <textPath href="#textPathUpper" startOffset="50%" text-anchor="middle">
      SMART COLLEGE OF TECHNOLOGY
    </textPath>
  </text>
  
  <text font-family="'Poppins', sans-serif" font-size="9" font-weight="600" fill="#0891b2" letter-spacing="2">
    <textPath href="#textPathLower" startOffset="50%" text-anchor="middle">
      ★ EXCELLENCE &amp; LEADERSHIP ★
    </textPath>
  </text>

  <!-- Central Crest -->
  <g transform="translate(68, 68) scale(0.64)">
    <polygon points="50,15 90,85 10,85" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/>
    <!-- Torch / Flame with Teal and Cyan -->
    <path d="M50,30 C45,45 55,50 48,65 C58,60 55,42 50,30 Z" fill="#0284c7"/>
    <path d="M50,38 C48,46 54,50 50,60 C55,55 53,44 50,38 Z" fill="#06b6d4"/>
    <rect x="46" y="65" width="8" height="15" fill="#0b192c" rx="2"/>
    <polygon points="40,80 60,80 50,75" fill="#0b192c"/>
  </g>
</svg>
